packages: []

allowBuilds:
  esbuild: true
  unrs-resolver: true

autoInstallPeers: false

catalogs:
  build:
    '@nuxt/devtools': 4.0.0-beta.1
    '@nuxt/eslint': ^1.17.0
    '@nuxt/kit': ^4.5.2
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^1.0.2
    '@tailwindcss/vite': ^4.3.3
    '@vite-pwa/nuxt': ^1.1.1
    '@vueuse/nuxt': ^14.4.0
    chokidar: ^5.0.0
    nuxt: ^4.5.2
    semver: ^7.8.5
    tailwindcss: ^4.3.3
    unplugin: ^3.3.0
    vite: ^8.2.2
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^26.6.2
    eslint: ^10.11.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.1
    typescript: ^6.0.3
    vitest: ^5.0.1
    vue-tsc: ^3.3.11
  frontend:
    '@vueuse/core': ^14.4.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    pinia: ^4.0.3
    reka-ui: ^2.10.5
    tailwind-merge: ^3.7.0
    vue: ^3.5.43
  icons:
    '@iconify-json/carbon': ^1.2.27
    '@iconify-json/twemoji': ^1.2.5

minimumReleaseAge: 0

minimumReleaseAgeExcludePrune: true

overrides:
  '@nuxt/devtools': catalog:build
  '@nuxt/kit': catalog:build
  chokidar: catalog:build
  nuxt: catalog:build
  rollup: 4.62.5
  semver: catalog:build
  unplugin: catalog:build
  vite: catalog:build
  workbox-build: 7.4.0

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7
