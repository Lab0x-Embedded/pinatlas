packages: []

allowBuilds:
  esbuild: true
  unrs-resolver: true

autoInstallPeers: false

minimumReleaseAge: 0

minimumReleaseAgeExcludePrune: true

overrides:
  '@nuxt/devtools': 4.0.0-beta.1
  '@nuxt/kit': ^4.5.2
  chokidar: ^5.0.0
  nuxt: ^4.5.2
  rollup: 4.62.5
  semver: ^7.8.5
  unplugin: ^3.3.0
  vite: ^8.2.2
  workbox-build: 7.4.0

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7
